[package]
name = "hydra-evaluator"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3.18"

anyhow = "1.0.98"
async-stream = "0.3"
clap = "4"
uuid = "1.16"
hashbrown = "0.17"
parking_lot = "0.12.4"
fs-err = { version = "3.0", features = ["tokio"] }

tokio = { version = "1.50", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
futures = "0.3"
prost = "0.14"
tonic-prost = "0.14"
tonic = { version = "0.14", features = ["zstd", "tls-webpki-roots"] }
tower = "0.5"
bytes = "1"
async-compression = { version = "0.4", default-features = false, features = ["tokio", "zstd"] }
hyper-util = { version = "0.1.10", features = ["full"] }

gethostname = "1"
url = "2.5.4"
toml = "1.0.0"

nix-utils = { path = "../../queue-runner-v2/crates/nix-utils" } # TODO
hydra-tracing = { git = "https://github.com/nixos/hydra" } # TODO
ofborg = { path = "../ofborg" }

[build-dependencies]
tonic-prost-build = "0.14"
