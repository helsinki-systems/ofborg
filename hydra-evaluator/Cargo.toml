[package]
name = "hydra-evaluator"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3.18"

anyhow = "1.0.98"
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
uuid = "1.16"
hashbrown = "0.17"
parking_lot = "0.12.4"
fs-err = { version = "3.0", features = ["tokio"] }

tokio = { version = "1.50", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
futures = "0.3"
prost = "0.14"
tonic-prost = "0.14"
tonic = { version = "0.14", features = ["zstd", "tls-webpki-roots"] }
tower = "0.5"
bytes = "1"
async-compression = { version = "0.4", default-features = false, features = ["tokio", "zstd"] }
hyper-util = { version = "0.1.10", features = ["full"] }

lapin = "4.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

gethostname = "1"
url = "2.5.4"
toml = "1.0.0"

harmonia-store-core = { git = "https://github.com/nix-community/harmonia.git" }
nix-utils = { git = "https://github.com/nixos/hydra", rev = "ac5f1a636d90725f2dbd7883b0b7b8604ee2f076" }
hydra-tracing = { git = "https://github.com/nixos/hydra", rev ="ac5f1a636d90725f2dbd7883b0b7b8604ee2f076" }
ofborg = { path = "../ofborg" }

[build-dependencies]
tonic-prost-build = "0.14"
