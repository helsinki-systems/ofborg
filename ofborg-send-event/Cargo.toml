[package]
name = "ofborg-send-event"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.13"
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0.135"
tracing = "0.1.41"

ofborg = { path = "../ofborg" }
